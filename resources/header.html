<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>{TITLE}</title>
    <link rel='stylesheet' href='/style.css?v={VERSION_HASH}'>
    <script>
      const httpPort = {HTTP_PORT};
      const httpsPort = {HTTPS_PORT};
      const useHttps = {USE_HTTPS};
      window.I18N_DICT = {I18N_JSON};
      window.t = function(key, ...args) {
          let str = (window.I18N_DICT && window.I18N_DICT[key]) || key;
          if (args.length > 0) {
              args.forEach((val, idx) => {
                  str = str.replace(new RegExp('\\{' + idx + '\\}', 'g'), val);
              });
          }
          return str;
      };
    </script>
</head>
