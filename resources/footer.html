    </div>
    <!-- Modal for Properties -->
    <div id='properties-modal' class='modal'>
        <div class='modal-content'>
            <div class='modal-header'>
                <span class='modal-title'>{MODAL_PROPERTIES_TITLE}</span>
                <button class='modal-close' onclick='closeProperties()'>&times;</button>
            </div>
            <div class='modal-body' id='properties-body'></div>
            <div class='modal-footer'>
                <button class='modal-btn' onclick='closeProperties()'>{MODAL_BTN_OK}</button>
            </div>
        </div>
    </div>

    <!-- Log Trigger Button -->
    <button class='log-trigger-btn' onclick='showLogs()'>
        <span>📝</span> {MENU_VIEW_LOGS}
    </button>

    <!-- Log Modal -->
    <div id='log-modal' class='modal'>
        <div class='modal-content log-modal-content'>
            <div class='modal-header'>
                <span class='modal-title'>{MODAL_LOGS_TITLE}</span>
                <button class='modal-close' onclick='closeLogs()'>&times;</button>
            </div>
            <div class='modal-body'>
                <div class='log-container' id='log-container'></div>
            </div>
            <div class='modal-footer'>
                <button class='modal-btn' style='background: var(--text-muted); margin-right: 10px;' onclick='clearLogs()'>{MODAL_LOGS_BTN_CLEAR}</button>
                <button class='modal-btn' onclick='closeLogs()'>{MODAL_BTN_OK}</button>
            </div>
        </div>
    </div>
    <script>const availableShells = {SHELLS_JSON};</script>
    <script src='/app.js?v={VERSION_HASH}'></script>
</body>
</html>
