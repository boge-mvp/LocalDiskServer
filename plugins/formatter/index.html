<div class='explorer-main' style='display: flex; flex-direction: column; height: 100%; min-width: 0;'>
  <!-- 顶部精简导航栏 (高度 38px，平级嵌入胶囊 Tab 切换) -->
  <div class='toolbar' style='flex-shrink: 0; padding: 4px 12px; height: 38px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color);'>
    <div class='toolbar-left' style='display: flex; align-items: center; gap: 8px; min-width: 0;'>
      <div class='address-bar-wrapper' style='min-height: 28px; padding: 0 4px;'>
        <div class='breadcrumbs' style='font-size: 0.85rem;'>
          <a href='/'>{NAV_HOME}</a> <span class='separator'>/</span> <span class='breadcrumb-current'>🛠️ {FORMATTER_TITLE}</span>
        </div>
      </div>
    </div>
    
    <!-- 顶部右侧：视图模式滑动开关 (单屏 vs 分屏) + 胶囊 Tab 分段切换器 -->
    <div class='toolbar-right' style='display: flex; align-items: center; gap: 8px; flex-shrink: 0;'>
      <!-- 视图模式单个滑动变色开关 (Sliding Switch) -->
      <div class='fmt-view-switch-wrapper' title='{TOOLTIP_VIEW_MODE_TOGGLE}'>
        <button id='fmt-view-switch' class='fmt-view-switch mode-single' onclick='toggleFmtViewMode()' role='switch' aria-checked='false'>
          <span class='fmt-switch-track'>
            <span class='fmt-switch-thumb'>
              <span class='fmt-switch-icon icon-single'>▭</span>
              <span class='fmt-switch-icon icon-split'>◫</span>
            </span>
            <span class='fmt-switch-text text-single'>{VIEW_MODE_SINGLE}</span>
            <span class='fmt-switch-text text-split'>{VIEW_MODE_SPLIT}</span>
          </span>
        </button>
      </div>

      <div class='fmt-tab-group'>
        <button class='fmt-tab-btn active' onclick='switchFmtTab("json")' id='fmt-tab-json'>{} {TAB_JSON}</button>
        <button class='fmt-tab-btn' onclick='switchFmtTab("xml")' id='fmt-tab-xml'>&lt;/&gt; {TAB_XML}</button>
        <button class='fmt-tab-btn' onclick='switchFmtTab("sql")' id='fmt-tab-sql'>🗄️ {TAB_SQL}</button>
        <button class='fmt-tab-btn' onclick='switchFmtTab("codecs")' id='fmt-tab-codecs'>🔤 {TAB_CODECS}</button>
        <button class='fmt-tab-btn' onclick='switchFmtTab("text")' id='fmt-tab-text'>📝 {TAB_TEXT}</button>
      </div>
      <button id='protocol-switch-btn' onclick='toggleProtocol(event)' class='btn-back' style='height: 28px; padding: 0 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--container-bg); color: var(--text-color); cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; flex-shrink: 0;' title='{LOBBY_PROTO_TOGGLE_TITLE}'></button>
    </div>
  </div>

  <!-- 功能主区域：零多余工具栏堆叠，视口直通编辑器 -->
  <div class='explorer-scroll-area' style='flex: 1; display: flex; flex-direction: column; padding: 8px 12px; box-sizing: border-box; overflow: hidden; min-height: 0;'>
    
    <!-- 轻量状态与报错浮条 (仅在出错时出现，不占静态高度) -->
    <div id='fmt-status-bar' style='display: none; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; margin-bottom: 6px; align-items: center; gap: 6px;'></div>

    <!-- 工作区 (默认单屏撑满，支持切到分屏) -->
    <div class='fmt-split-view mode-single' id='fmt-split-view' style='flex: 1; display: flex; min-height: 0; height: 100%; position: relative;'>
      
      <!-- 输入区 (单屏模式下撑满 100%，具备完整动作栏) -->
      <div id='fmt-pane-input' class='fmt-pane' style='flex: 1; display: flex; flex-direction: column; background: var(--container-bg); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; min-width: 0;'>
        <div class='fmt-pane-header' id='fmt-input-header'>
          <!-- 左侧固定排列区：标题 + 元数据 Badge + 各功能专属动作按钮组（固定靠左紧凑排列，严禁居中浮动） -->
          <div class='fmt-header-left' style='display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; justify-content: flex-start; overflow-x: auto;'>
            <span class='fmt-pane-title' id='fmt-input-title'>{LBL_INPUT}</span>
            <span id='fmt-input-badge' class='fmt-meta-badge'>0 行 · 0 字符</span>
            <div class='fmt-header-divider' style='width: 1px; height: 16px; background: var(--border-color); margin: 0 2px; flex-shrink: 0;'></div>
            <div id='fmt-actions-container' style='display: flex; align-items: center; gap: 4px; flex-wrap: nowrap;'></div>
          </div>

          <!-- 右侧通用操作按钮组 -->
          <div style='display: flex; align-items: center; gap: 4px; flex-shrink: 0;'>
            <button id='fmt-btn-edit-mode' class='fmt-tool-btn' style='display: none;' onclick='fmtSwitchToInputEdit()' title='切换回文本编辑模式'>✏️ 编辑</button>
            <button class='fmt-tool-btn' onclick='fmtLoadSample()' title='{TOOLTIP_SAMPLE}'>{BTN_SAMPLE}</button>
            <button class='fmt-tool-btn' onclick='fmtPasteInput()' title='{TOOLTIP_PASTE}'>{BTN_PASTE}</button>
            <button class='fmt-tool-btn fmt-tool-btn-danger' onclick='fmtClearInput()' title='{TOOLTIP_CLEAR}'>{BTN_CLEAR}</button>
            <button class='fmt-tool-btn fmt-tool-btn-primary' id='fmt-btn-input-copy' onclick='fmtCopyInput()' title='{TOOLTIP_COPY}'>{BTN_COPY}</button>
          </div>
        </div>
        <div style='flex: 1; position: relative; display: flex; min-height: 0; overflow: hidden;'>
          <textarea id='fmt-input' class='fmt-editor' placeholder='{DROP_FILE_HINT}' spellcheck='false'></textarea>
          <div id='fmt-input-highlight' class='fmt-editor fmt-code-highlight' style='display: none; position: absolute; inset: 0; overflow: auto; background: var(--container-bg);' ondblclick='fmtSwitchToInputEdit()'></div>
        </div>
        <div class='fmt-pane-footer'>
          <span id='fmt-input-lines'>0 行</span>
          <span id='fmt-input-chars'>0 字符</span>
          <span id='fmt-input-size'>0 B</span>
        </div>
      </div>

      <!-- 中间拖动分割线手柄 (仅分屏可见) -->
      <div id='fmt-splitter' class='fmt-splitter' title='{SPLITTER_HINT}' role='separator' aria-orientation='vertical' style='display: none;'>
        <div class='fmt-splitter-line'></div>
        <div class='fmt-splitter-thumb'>
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- 右栏：输出区 (仅分屏可见) -->
      <div id='fmt-pane-output' class='fmt-pane' style='display: none; flex: 1; flex-direction: column; background: var(--container-bg); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; min-width: 0;'>
        <div class='fmt-pane-header' id='fmt-output-header'>
          <!-- 分屏模式下的动作按钮占位容器 -->
          <div id='fmt-actions-split-placeholder' style='display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow-x: auto; min-width: 0;'></div>
          
          <div style='display: flex; align-items: center; gap: 4px; flex-shrink: 0;'>
            <span id='fmt-valid-badge' style='display: none;' class='fmt-badge-valid'>✓ {STATUS_VALID}</span>
            <button class='fmt-tool-btn' onclick='fmtApplyToInput()' title='{TOOLTIP_APPLY}'>{BTN_APPLY_TO_INPUT}</button>
            <button class='fmt-tool-btn fmt-tool-btn-primary' id='fmt-btn-copy' onclick='fmtCopyOutput()' title='{TOOLTIP_COPY}'>{BTN_COPY}</button>
          </div>
        </div>
        <div style='flex: 1; position: relative; display: flex; min-height: 0; overflow: hidden;'>
          <div id='fmt-output-highlight' class='fmt-editor fmt-code-highlight' style='display: block; position: absolute; inset: 0; overflow: auto; background: var(--container-bg);'></div>
          <textarea id='fmt-output' class='fmt-editor' readonly placeholder='{STATUS_READY}' spellcheck='false' style='display: none;'></textarea>
        </div>
        <div class='fmt-pane-footer'>
          <span id='fmt-output-lines'>0 行</span>
          <span id='fmt-output-chars'>0 字符</span>
          <span id='fmt-output-size'>0 B</span>
        </div>
      </div>

    </div>

  </div>
</div>

  // ── 全工作区安全清空重置 (Workspace Reset) ──
  function clearAllWorkspaces() {
    var inEl = document.getElementById('fmt-input');
    var outEl = document.getElementById('fmt-output');
    var inHl = document.getElementById('fmt-input-highlight');
    var outHl = document.getElementById('fmt-output-highlight');
    var btnEdit = document.getElementById('fmt-btn-edit-mode');

    if (inEl) inEl.value = '';
    if (outEl) outEl.value = '';
    if (inHl) {
      inHl.innerHTML = '';
      inHl.style.display = 'none';
    }
    if (outHl) {
      outHl.innerHTML = '';
    }
    if (inEl) {
      inEl.style.display = 'block';
    }
    if (btnEdit) {
      btnEdit.style.display = 'none';
      btnEdit.innerHTML = '✏️ 编辑';
    }

    rawSourceText = '';
    isFormattedState = false;
    updateStats('input', '');
    updateStats('output', '');
    hideStatus();
  }

  window.switchFmtTab = function(tab) {
    if (currentTab !== tab) {
      clearAllWorkspaces();
    }
    currentTab = tab;
    document.querySelectorAll('.fmt-tab-btn').forEach(function(b) { b.classList.remove('active'); });
    var activeBtn = document.getElementById('fmt-tab-' + tab);
    if (activeBtn) activeBtn.classList.add('active');

    var splitView = document.getElementById('fmt-split-view');
    if (splitView) splitView.style.display = 'flex';
    renderToolbar();
    setFmtViewMode(viewMode);
    hideStatus();
  };

  window.toggleFmtViewMode = function() {
    var nextMode = (viewMode === 'single') ? 'split' : 'single';
    setFmtViewMode(nextMode);
  };

  window.setFmtViewMode = function(mode) {
    viewMode = mode;
    localStorage.setItem('fmt_view_mode', mode);

    var switchEl = document.getElementById('fmt-view-switch');
    if (switchEl) {
      switchEl.className = 'fmt-sliding-switch mode-' + mode;
      var optSingle = document.getElementById('fmt-mode-opt-single');
      var optSplit = document.getElementById('fmt-mode-opt-split');
      if (optSingle && optSplit) {
        if (mode === 'single') {
          optSingle.classList.add('active');
          optSplit.classList.remove('active');
        } else {
          optSingle.classList.remove('active');
          optSplit.classList.add('active');
        }
      }
    }

    var splitView = document.getElementById('fmt-split-view');
    var paneInput = document.getElementById('fmt-pane-input');
    var paneOutput = document.getElementById('fmt-pane-output');
    var splitter = document.getElementById('fmt-splitter');
    var inEl = document.getElementById('fmt-input');
    var inHl = document.getElementById('fmt-input-highlight');
    var btnEdit = document.getElementById('fmt-btn-edit-mode');
    var btnCopyInput = document.getElementById('fmt-btn-input-copy');

    if (mode === 'single') {
      if (splitView) splitView.className = 'fmt-split-view mode-single';
      if (paneOutput) paneOutput.style.display = 'none';
      if (splitter) splitter.style.display = 'none';
      if (paneInput) {
        paneInput.style.flex = '1 1 100%';
        paneInput.style.width = ''; // 清空可能残留的行内 width
      }
      if (btnCopyInput) btnCopyInput.style.display = 'inline-flex';

      // 若在分屏模式下已有格式化输出，切换到单屏时保持彩色高亮展示
      var outHl = document.getElementById('fmt-output-highlight');
      var outEl = document.getElementById('fmt-output');
      if (outHl && outHl.innerHTML.trim() && outEl && outEl.value.trim()) {
        if (inEl) inEl.value = outEl.value;
        if (inHl) {
          inHl.innerHTML = outHl.innerHTML;
          inHl.style.display = 'block';
        }
        if (inEl) inEl.style.display = 'none';
        if (btnEdit) btnEdit.style.display = 'inline-flex';
      } else if (inHl && inHl.innerHTML.trim() && isFormattedState) {
        inHl.style.display = 'block';
        if (inEl) inEl.style.display = 'none';
        if (btnEdit) btnEdit.style.display = 'inline-flex';
      }
    } else {
      if (splitView) splitView.className = 'fmt-split-view mode-split';
      if (paneOutput) paneOutput.style.display = 'flex';
      if (splitter) splitter.style.display = 'flex';

      // 切到分屏时，彻底清除行内 width 限制
      if (paneInput) paneInput.style.width = '';

      // 切到分屏时，输入区切回普通 textarea 编辑模式
      if (inHl) inHl.style.display = 'none';
      if (inEl) inEl.style.display = 'block';
      if (btnEdit) btnEdit.style.display = 'none';
      if (btnCopyInput) btnCopyInput.style.display = 'none';

      // 规范化恢复分栏拖拽比例：兼容百分比 (15~85) 与小数 (0.15~0.85)
      var rawRatio = localStorage.getItem('fmt_split_ratio');
      var ratio = 50;
      if (rawRatio) {
        var parsed = parseFloat(rawRatio);
        if (!isNaN(parsed)) {
          ratio = parsed <= 1 ? parsed * 100 : parsed;
        }
      }
      if (ratio < 15) ratio = 15;
      if (ratio > 85) ratio = 85;

      if (paneInput) paneInput.style.flex = '0 0 ' + ratio + '%';
      if (paneOutput) paneOutput.style.flex = '1 1 0%';
    }
    renderToolbar();
  };

  // ── JSON 语法高亮引擎 (区分 Key、String Value、Number、Boolean/Null) ──
  function highlightJson(jsonStr) {
    if (!jsonStr) return '';
    var safe = jsonStr
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    return safe.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?|[{}\[\]])/g, function (match) {
      if (match === '{' || match === '}' || match === '[' || match === ']') {
        return '<span class="fmt-hl-bracket">' + match + '</span>';
      }
      if (/^"/.test(match)) {
        if (/:$/.test(match)) {
          var keyPart = match.slice(0, -1);
          return '<span class="fmt-hl-key">' + keyPart + '</span>:';
        }
        return '<span class="fmt-hl-string">' + match + '</span>';
      }
      if (/true|false/.test(match)) {
        return '<span class="fmt-hl-boolean">' + match + '</span>';
      }
      if (/null/.test(match)) {
        return '<span class="fmt-hl-null">' + match + '</span>';
      }
      return '<span class="fmt-hl-number">' + match + '</span>';
    });
  }

  // ── 预处理：容错处理字符串字面量中未转义的真实物理回车换行 ──
  function sanitizeJsonInput(str) {
    if (!str) return str;
    var out = [];
    var inStr = false;
    var quoteChar = '';
    var isEscaped = false;

    for (var i = 0; i < str.length; i++) {
      var c = str.charAt(i);
      if (inStr) {
        if (isEscaped) {
          out.push(c);
          isEscaped = false;
        } else if (c === '\\') {
          out.push(c);
          isEscaped = true;
        } else if (c === quoteChar) {
          out.push(c);
          inStr = false;
        } else if (c === '\r') {
          if (i + 1 < str.length && str.charAt(i + 1) === '\n') {
            i++;
          }
          out.push('\\n');
        } else if (c === '\n') {
          out.push('\\n');
        } else {
          out.push(c);
        }
      } else {
        if (c === '"' || c === "'") {
          inStr = true;
          quoteChar = c;
          out.push(c);
        } else {
          out.push(c);
        }
      }
    }
    return out.join('');
  }

  // ── 后处理：将 JSON 字符串内部的 \n / \\n 换行符展开为真实物理换行排版 ──
  function expandJsonNewlines(jsonStr) {
    if (!jsonStr) return jsonStr;
    var out = [];
    var inStr = false;
    var curIndent = '';
    var lineStart = 0;

    for (var i = 0; i < jsonStr.length; i++) {
      var c = jsonStr.charAt(i);
      if (!inStr) {
        out.push(c);
        if (c === '\n') {
          lineStart = i + 1;
        } else if (c === '"') {
          inStr = true;
          var indentMatch = jsonStr.substring(lineStart, i).match(/^(\s*)/);
          curIndent = indentMatch ? indentMatch[1] : '';
        }
      } else {
        if (c === '"' && (i === 0 || jsonStr.charAt(i - 1) !== '\\')) {
          inStr = false;
          out.push(c);
        } else if (c === '\\' && i + 1 < jsonStr.length) {
          var next = jsonStr.charAt(i + 1);
          var targetIndent = curIndent + '  ';
          if (next === 'n') {
            var rest = jsonStr.substring(i + 2, i + 2 + targetIndent.length);
            if (rest === targetIndent) {
              out.push('\n');
            } else {
              out.push('\n' + targetIndent);
            }
            i++;
          } else if (next === 'r') {
            if (i + 2 < jsonStr.length && jsonStr.charAt(i + 2) === 'n') {
              var restR = jsonStr.substring(i + 3, i + 3 + targetIndent.length);
              if (restR === targetIndent) {
                out.push('\n');
              } else {
                out.push('\n' + targetIndent);
              }
              i += 2;
            } else {
              i++;
            }
          } else if (next === '\\' && i + 2 < jsonStr.length && jsonStr.charAt(i + 2) === 'n') {
            var restD = jsonStr.substring(i + 3, i + 3 + targetIndent.length);
            if (restD === targetIndent) {
              out.push('\n');
            } else {
              out.push('\n' + targetIndent);
            }
            i += 2;
          } else if (next === 't') {
            out.push('\t');
            i++;
          } else {
            out.push(c);
          }
        } else {
          out.push(c);
        }
      }
    }
    return out.join('');
  }

  function deepParseJson(val, depth) {
    if (depth === undefined) depth = 0;
    if (depth > 20) return val;

    if (typeof val === 'string') {
      var s = val.trim();
      if ((s.charAt(0) === '{' && s.charAt(s.length - 1) === '}') ||
          (s.charAt(0) === '[' && s.charAt(s.length - 1) === ']')) {
        try {
          var parsed = JSON.parse(s);
          if (parsed && typeof parsed === 'object') {
            return deepParseJson(parsed, depth + 1);
          }
        } catch (e) {
          // 忽略解析错误，保持原值
        }
      }
      return val;
    }

    if (Array.isArray(val)) {
      return val.map(function(item) {
        return deepParseJson(item, depth + 1);
      });
    }

    if (typeof val === 'object' && val !== null) {
      var res = {};
      for (var k in val) {
        if (Object.prototype.hasOwnProperty.call(val, k)) {
          res[k] = deepParseJson(val[k], depth + 1);
        }
      }
      return res;
    }

    return val;
  }

  function getIndent() {
    if (indentType === 'tab') return '\t';
    return parseInt(indentType, 10) || 2;
  }

  function showAlreadyFormattedNotice() {
    var badge = document.getElementById('fmt-valid-badge');
    if (badge) {
      badge.textContent = T.status_already_formatted || '✓ 已是最新格式化内容';
      badge.style.display = 'inline-block';
      badge.style.background = 'rgba(39, 174, 96, 0.2)';
      badge.style.color = '#27ae60';
      badge.style.transition = 'all 0.2s ease';
      setTimeout(function() {
        badge.textContent = T.status_valid || '✓ 语法有效';
        badge.style.background = '';
        badge.style.color = '';
      }, 1500);
    }
  }

  // ── JSON 处理 ──
  window.fmtRunJson = function(action) {
    // 始终以原始字符源为基准进行处理
    var raw = (rawSourceText || document.getElementById('fmt-input').value || '').trim();
    if (!raw) return;

    if (action === 'format') {
      var inHl = document.getElementById('fmt-input-highlight');
      var isSingleHlVisible = inHl && window.getComputedStyle(inHl).display !== 'none';
      // 只有在单屏高亮层已经呈现、且确实已格式化时才拦截；
      // 如果处于文本编辑状态，用户点击格式化必须立即切回高亮彩色视图！
      if (isFormattedState && (viewMode !== 'single' || isSingleHlVisible)) {
        showAlreadyFormattedNotice();
        return;
      }
    }

    var sanitized = sanitizeJsonInput(raw);

    try {
      if (action === 'format') {
        var obj;
        try {
          obj = JSON.parse(sanitized);
        } catch(pe) {
          if (sanitized.charAt(0) !== '{' && sanitized.charAt(0) !== '[') {
            if (unescapeNewlinesEnabled) {
              var plain = raw.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\\t/g, '\t');
              setOutput(plain, true);
              isFormattedState = true;
              return;
            }
          }
          throw pe;
        }

        if (deepParseEnabled) {
          obj = deepParseJson(obj);
        }
        var formatted = JSON.stringify(obj, null, getIndent());
        if (unescapeNewlinesEnabled) {
          formatted = expandJsonNewlines(formatted);
        }
        setOutput(formatted, true);
        isFormattedState = true;
      } else if (action === 'minify') {
        var obj = JSON.parse(sanitized);
        if (deepParseEnabled) {
          obj = deepParseJson(obj);
        }
        var minified = JSON.stringify(obj);
        if (unescapeNewlinesEnabled) {
          minified = expandJsonNewlines(minified);
        }
        setOutput(minified, true);
        isFormattedState = false;
      } else if (action === 'repair') {
        var repaired = sanitized
          .replace(/,\s*([\}\]])/g, '$1')
          .replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":')
          .replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g, '"$1"');
        var obj = JSON.parse(repaired);
        if (deepParseEnabled) {
          obj = deepParseJson(obj);
        }
        var out = JSON.stringify(obj, null, getIndent());
        if (unescapeNewlinesEnabled) {
          out = expandJsonNewlines(out);
        }
        setOutput(out, true);
        isFormattedState = true;
      } else if (action === 'escape') {
        setOutput(JSON.stringify(raw), true);
        isFormattedState = false;
      } else if (action === 'unescape') {
        var val = raw;
        if (val.charAt(0) === '"' && val.charAt(val.length - 1) === '"') {
          try { val = JSON.parse(val); } catch(e) {}
        }
        val = val.replace(/\\"/g, '"').replace(/\\\\/g, '\\').replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\\t/g, '\t');
        setOutput(val, true);
        isFormattedState = false;
      } else if (action === 'to_xml') {
        var obj = JSON.parse(sanitized);
        if (deepParseEnabled) {
          obj = deepParseJson(obj);
        }
        var xml = '<?xml version="1.0" encoding="UTF-8"?>\n<root>\n' + jsonToXml(obj, '  ') + '\n</root>';
        setOutput(xml, true);
        isFormattedState = false;
      }
    } catch (e) {
      showError(e.message);
    }
  };

  function jsonToXml(obj, indent) {
    var xml = '';
    for (var prop in obj) {
      if (!obj.hasOwnProperty(prop)) continue;
      var val = obj[prop];
      if (Array.isArray(val)) {
        for (var i = 0; i < val.length; i++) {
          xml += indent + '<' + prop + '>\n' + jsonToXml(val[i], indent + '  ') + '\n' + indent + '</' + prop + '>\n';
        }
      } else if (typeof val === 'object' && val !== null) {
        xml += indent + '<' + prop + '>\n' + jsonToXml(val, indent + '  ') + '\n' + indent + '</' + prop + '>\n';
      } else {
        xml += indent + '<' + prop + '>' + String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</' + prop + '>\n';
      }
    }
    return xml.replace(/\n$/, '');
  }

  // ── XML 处理 ──
  window.fmtRunXml = function(action) {
    var raw = (document.getElementById('fmt-input').value || '').trim();
    if (!raw) return;

    try {
      var parser = new DOMParser();
      var xmlDoc = parser.parseFromString(raw, 'text/xml');
      var parserError = xmlDoc.getElementsByTagName('parsererror');
      if (parserError.length > 0) {
        throw new Error(parserError[0].textContent.split('\n')[0]);
      }

      if (action === 'format') {
        setOutput(formatXmlString(raw, getIndent()), true);
      } else if (action === 'minify') {
        setOutput(raw.replace(/>\s+</g, '><').trim(), true);
      } else if (action === 'to_json') {
        var jsonObj = xmlToJson(xmlDoc.documentElement);
        var res = {};
        res[xmlDoc.documentElement.nodeName] = jsonObj;
        setOutput(JSON.stringify(res, null, getIndent()), true);
      }
    } catch (e) {
      showError(e.message);
    }
  };

  function formatXmlString(xml, indentSetting) {
    var pad = 0;
    var indentStr = typeof indentSetting === 'string' ? indentSetting : ' '.repeat(indentSetting);
    var formatted = '';
    var reg = /(>)(<)(\/*)/g;
    xml = xml.replace(reg, '$1\r\n$2$3');
    var lines = xml.split('\r\n');

    lines.forEach(function(node) {
      var indent = 0;
      if (node.match(/.+<\/\w[^>]*>$/)) {
        indent = 0;
      } else if (node.match(/^<\/\w/)) {
        if (pad !== 0) pad -= 1;
      } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) {
        indent = 1;
      } else {
        indent = 0;
      }

      var padding = '';
      for (var i = 0; i < pad; i++) padding += indentStr;
      formatted += padding + node + '\r\n';
      pad += indent;
    });

    return formatted.trim();
  }

  function xmlToJson(xml) {
    var obj = {};
    if (xml.nodeType === 1) {
      if (xml.attributes.length > 0) {
        obj['@attributes'] = {};
        for (var j = 0; j < xml.attributes.length; j++) {
          var attribute = xml.attributes.item(j);
          obj['@attributes'][attribute.nodeName] = attribute.nodeValue;
        }
      }
    } else if (xml.nodeType === 3) {
      obj = xml.nodeValue.trim();
    }

    if (xml.hasChildNodes()) {
      for (var i = 0; i < xml.childNodes.length; i++) {
        var item = xml.childNodes.item(i);
        var nodeName = item.nodeName;
        if (item.nodeType === 3) {
          var text = item.nodeValue.trim();
          if (text) return text;
        } else {
          if (typeof obj[nodeName] === 'undefined') {
            obj[nodeName] = xmlToJson(item);
          } else {
            if (typeof obj[nodeName].push === 'undefined') {
              var old = obj[nodeName];
              obj[nodeName] = [];
              obj[nodeName].push(old);
            }
            obj[nodeName].push(xmlToJson(item));
          }
        }
      }
    }
    return obj;
  }

  // ── SQL 处理 ──
  window.fmtRunSql = function(action) {
    var raw = (document.getElementById('fmt-input').value || '').trim();
    if (!raw) return;

    if (action === 'minify') {
      setOutput(raw.replace(/\s+/g, ' ').trim(), true);
      return;
    }

    var keywords = ['SELECT', 'FROM', 'WHERE', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'FULL JOIN', 'JOIN', 'GROUP BY', 'ORDER BY', 'HAVING', 'LIMIT', 'OFFSET', 'UNION ALL', 'UNION', 'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM', 'CREATE TABLE', 'DROP TABLE', 'ALTER TABLE', 'AND', 'OR'];
    var sql = raw.replace(/\s+/g, ' ');

    keywords.forEach(function(kw) {
      var re = new RegExp('\\b' + kw.replace(' ', '\\s+') + '\\b', 'gi');
      sql = sql.replace(re, '\n' + kw + ' ');
    });

    sql = sql.replace(/,\s*/g, ',\n  ');
    sql = sql.split('\n').map(function(l) { return l.trim(); }).filter(Boolean).join('\n');
    setOutput(sql, true);
  };

  // ── 编解码处理 ──
  window.fmtRunCodec = function(type) {
    var raw = (document.getElementById('fmt-input').value || '').trim();
    if (!raw) return;

    try {
      if (type === 'url_encode') {
        setOutput(encodeURIComponent(raw), true);
      } else if (type === 'url_decode') {
        var decoded = decodeURIComponent(raw);
        if (decoded.indexOf('?') > 0) {
          var parts = decoded.split('?');
          var params = parts[1].split('&');
          var paramLines = params.map(function(p) {
            var kv = p.split('=');
            return '  ' + kv[0] + ' = ' + (kv[1] || '');
          }).join('\n');
          setOutput(decoded + '\n\n/* ── Query Parameters (' + params.length + ') ── */\n' + paramLines, true);
        } else {
          setOutput(decoded, true);
        }
      } else if (type === 'b64_encode') {
        setOutput(btoa(unescape(encodeURIComponent(raw))), true);
      } else if (type === 'b64_decode') {
        setOutput(decodeURIComponent(escape(atob(raw))), true);
      } else if (type === 'unicode_encode') {
        var res = '';
        for (var i = 0; i < raw.length; i++) {
          var code = raw.charCodeAt(i);
          if (code > 127) res += '\\u' + ('0000' + code.toString(16)).slice(-4);
          else res += raw.charAt(i);
        }
        setOutput(res, true);
      } else if (type === 'unicode_decode') {
        setOutput(raw.replace(/\\u([0-9a-fA-F]{4})/g, function(match, hex) {
          return String.fromCharCode(parseInt(hex, 16));
        }), true);
      } else if (type === 'jwt_decode') {
        var segments = raw.split('.');
        if (segments.length < 2) throw new Error('无效的 JWT 格式（需至少包含 Header 和 Payload 两段）');
        var decodeB64Url = function(str) {
          var base64 = str.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) base64 += '=';
          return decodeURIComponent(escape(atob(base64)));
        };
        var header = JSON.parse(decodeB64Url(segments[0]));
        var payload = JSON.parse(decodeB64Url(segments[1]));

        var meta = [];
        if (payload.exp) meta.push('过期时间 (exp): ' + new Date(payload.exp * 1000).toLocaleString());
        if (payload.iat) meta.push('签发时间 (iat): ' + new Date(payload.iat * 1000).toLocaleString());
        if (payload.sub) meta.push('主题 (sub): ' + payload.sub);

        var out = '/* ── Header ── */\n' + JSON.stringify(header, null, 2) + 
                  '\n\n/* ── Payload ── */\n' + JSON.stringify(payload, null, 2) +
                  (segments[2] ? ('\n\n/* ── Signature ── */\n' + segments[2]) : '') +
                  (meta.length ? ('\n\n/* ── Token Metadata ── */\n' + meta.join('\n')) : '');
        setOutput(out, true);
      }
    } catch (e) {
      showError(e.message);
    }
  };

  // ── 文本与命名工具 ──
  window.fmtRunText = function(type) {
    var raw = document.getElementById('fmt-input').value || '';
    if (!raw) return;

    if (type === 'upper') {
      setOutput(raw.toUpperCase(), true);
    } else if (type === 'lower') {
      setOutput(raw.toLowerCase(), true);
    } else if (type === 'camel') {
      setOutput(raw.split('\n').map(toCamel).join('\n'), true);
    } else if (type === 'pascal') {
      setOutput(raw.split('\n').map(toPascal).join('\n'), true);
    } else if (type === 'snake') {
      setOutput(raw.split('\n').map(toSnake).join('\n'), true);
    } else if (type === 'kebab') {
      setOutput(raw.split('\n').map(toKebab).join('\n'), true);
    } else if (type === 'sort_asc') {
      setOutput(raw.split('\n').sort().join('\n'), true);
    } else if (type === 'sort_desc') {
      setOutput(raw.split('\n').sort().reverse().join('\n'), true);
    } else if (type === 'dedup') {
      var seen = {};
      var deduped = raw.split('\n').filter(function(line) {
        return seen.hasOwnProperty(line) ? false : (seen[line] = true);
      });
      setOutput(deduped.join('\n'), true);
    } else if (type === 'trim') {
      setOutput(raw.split('\n').map(function(l) { return l.trim(); }).join('\n'), true);
    } else if (type === 'clean_empty') {
      setOutput(raw.split('\n').filter(function(l) { return l.trim() !== ''; }).join('\n'), true);
    }
  };

  function toWords(str) {
    return str.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_\-\s]+/g, ' ').trim().split(' ').filter(Boolean);
  }
  function toCamel(str) {
    var words = toWords(str);
    if (!words.length) return str;
    return words[0].toLowerCase() + words.slice(1).map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }).join('');
  }
  function toPascal(str) {
    var words = toWords(str);
    return words.map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }).join('');
  }
  function toSnake(str) {
    var words = toWords(str);
    return words.map(function(w) { return w.toLowerCase(); }).join('_');
  }
  function toKebab(str) {
    var words = toWords(str);
    return words.map(function(w) { return w.toLowerCase(); }).join('-');
  }

  // ── 通用辅助与度量 ──
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function setOutput(val, valid) {
    var outEl = document.getElementById('fmt-output');
    if (outEl) outEl.value = val;
    updateStats('output', val);

    var highlightedHtml = currentTab === 'json' ? highlightJson(val) : escapeHtml(val);

    // 更新分屏输出区的高亮层
    var outHl = document.getElementById('fmt-output-highlight');
    if (outHl) {
      outHl.innerHTML = highlightedHtml;
    }

    // 单屏模式：原输入框就地格式化，并展现高亮视图
    if (viewMode === 'single') {
      var inEl = document.getElementById('fmt-input');
      var inHl = document.getElementById('fmt-input-highlight');
      var btnEdit = document.getElementById('fmt-btn-edit-mode');
      if (inEl) {
        inEl.value = val;
        updateStats('input', val);
      }
      if (inHl && inEl) {
        inHl.innerHTML = highlightedHtml;
        inHl.style.display = 'block';
        inEl.style.display = 'none';
        if (btnEdit) {
          btnEdit.innerHTML = '✏️ 编辑';
          btnEdit.title = '切换回文本编辑模式';
          btnEdit.style.display = 'inline-flex';
        }
      }
    }

    if (valid) {
      showSuccess();
    }
  }

  window.fmtSwitchToInputEdit = function() {
    var inEl = document.getElementById('fmt-input');
    var inHl = document.getElementById('fmt-input-highlight');
    var btnEdit = document.getElementById('fmt-btn-edit-mode');
    if (!inEl || !inHl) return;

    var isHl = window.getComputedStyle(inHl).display !== 'none';
    if (isHl) {
      inHl.style.display = 'none';
      inEl.style.display = 'block';
      if (btnEdit) {
        btnEdit.innerHTML = '👁️ 预览';
        btnEdit.title = '切换回彩色高亮视图';
      }
      isFormattedState = false;
      inEl.focus();
    } else {
      if (inHl.innerHTML.trim()) {
        inHl.style.display = 'block';
        inEl.style.display = 'none';
        if (btnEdit) {
          btnEdit.innerHTML = '✏️ 编辑';
          btnEdit.title = '切换回文本编辑模式';
        }
      }
    }
  };

  window.fmtCopyInput = function() {
    var inEl = document.getElementById('fmt-input');
    var text = inEl ? inEl.value : '';
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showCopyFeedback('fmt-btn-input-copy');
      });
    } else {
      inEl.select();
      document.execCommand('copy');
      showCopyFeedback('fmt-btn-input-copy');
    }
  };

  function showCopyFeedback(btnId) {
    var btn = document.getElementById(btnId || 'fmt-btn-copy');
    if (!btn) return;
    var orig = btn.textContent;
    btn.textContent = '✓ ' + T.btn_copied;
    btn.style.background = '#27ae60';
    setTimeout(function() {
      btn.textContent = orig;
      btn.style.background = '';
    }, 1500);
  }

  function showSuccess() {
    var sb = document.getElementById('fmt-status-bar');
    var badge = document.getElementById('fmt-valid-badge');
    if (sb) sb.style.display = 'none';
    if (badge) badge.style.display = 'inline-block';
  }

  function showError(msg) {
    var sb = document.getElementById('fmt-status-bar');
    var badge = document.getElementById('fmt-valid-badge');
    if (badge) badge.style.display = 'none';
    if (sb) {
      sb.style.display = 'flex';
      sb.style.background = 'rgba(231, 76, 60, 0.15)';
      sb.style.border = '1px solid #e74c3c';
      sb.style.color = '#c0392b';
      sb.innerHTML = '<span>❌ ' + T.status_invalid.replace('{0}', msg) + '</span>';
    }
  }

  function hideStatus() {
    var sb = document.getElementById('fmt-status-bar');
    var badge = document.getElementById('fmt-valid-badge');
    if (sb) sb.style.display = 'none';
    if (badge) badge.style.display = 'none';
  }

  function updateStats(type, text) {
    var lines = text ? text.split('\n').length : 0;
    var chars = text ? text.length : 0;
    var size = new Blob([text || '']).size;

    var lEl = document.getElementById('fmt-' + type + '-lines');
    var cEl = document.getElementById('fmt-' + type + '-chars');
    var sEl = document.getElementById('fmt-' + type + '-size');
    if (lEl) lEl.textContent = lines + ' 行';
    if (cEl) cEl.textContent = chars + ' 字符';
    if (sEl) sEl.textContent = formatSize(size);

    if (type === 'input') {
      var badge = document.getElementById('fmt-input-badge');
      if (badge) badge.textContent = lines + ' 行 · ' + chars + ' 字符';
    }
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ── 输入交互 ──
  window.fmtLoadSample = function() {
    var s = samples[currentTab] || '';
    var inEl = document.getElementById('fmt-input');
    inEl.value = s;
    rawSourceText = s;
    isFormattedState = false;
    updateStats('input', s);
    if (currentTab === 'json') fmtRunJson('format');
    else if (currentTab === 'xml') fmtRunXml('format');
    else if (currentTab === 'sql') fmtRunSql('format');
    else if (currentTab === 'codecs') fmtRunCodec('url_decode');
    else if (currentTab === 'text') fmtRunText('camel');
  };

  window.fmtPasteInput = function() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function(text) {
        var inEl = document.getElementById('fmt-input');
        inEl.value = text;
        rawSourceText = text;
        isFormattedState = false;
        updateStats('input', text);
      }).catch(function() {
        document.getElementById('fmt-input').focus();
      });
    } else {
      document.getElementById('fmt-input').focus();
    }
  };

  window.fmtClearInput = function() {
    clearAllWorkspaces();
  };

  window.fmtApplyToInput = function() {
    var outVal = document.getElementById('fmt-output').value || '';
    if (!outVal) return;
    var inEl = document.getElementById('fmt-input');
    inEl.value = outVal;
    rawSourceText = outVal;
    isFormattedState = false;
    updateStats('input', outVal);
  };

  window.fmtCopyOutput = function() {
    var outVal = document.getElementById('fmt-output').value || '';
    if (!outVal) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(outVal).then(function() {
        showCopiedFeedback();
      });
    } else {
      var outEl = document.getElementById('fmt-output');
      outEl.select();
      document.execCommand('copy');
      showCopiedFeedback();
    }
  };

  function showCopiedFeedback() {
    var btn = document.getElementById('fmt-btn-copy');
    if (!btn) return;
    var orig = btn.textContent;
    btn.textContent = '✓ ' + T.btn_copied;
    btn.style.background = '#27ae60';
    setTimeout(function() {
      btn.textContent = orig;
      btn.style.background = '';
    }, 1500);
  }

  // 拖拽文件读取
  function initDragDrop() {
    var inEl = document.getElementById('fmt-input');
    if (!inEl) return;

    ['dragenter', 'dragover'].forEach(function(evt) {
      inEl.addEventListener(evt, function(e) {
        e.preventDefault();
        e.stopPropagation();
        inEl.style.background = 'var(--hover-bg, rgba(0,0,0,0.03))';
      });
    });

    ['dragleave', 'drop'].forEach(function(evt) {
      inEl.addEventListener(evt, function(e) {
        e.preventDefault();
        e.stopPropagation();
        inEl.style.background = 'transparent';
      });
    });

    inEl.addEventListener('drop', function(e) {
      var files = e.dataTransfer.files;
      if (files && files.length > 0) {
        var reader = new FileReader();
        reader.onload = function(evt) {
          inEl.value = evt.target.result;
          rawSourceText = inEl.value;
          isFormattedState = false;
          updateStats('input', inEl.value);
          // 自动识别扩展名切换 Tab
          var fname = files[0].name.toLowerCase();
          if (fname.endsWith('.json')) switchFmtTab('json');
          else if (fname.endsWith('.xml')) switchFmtTab('xml');
          else if (fname.endsWith('.sql')) switchFmtTab('sql');
        };
        reader.readAsText(files[0]);
      }
    });

    inEl.addEventListener('input', function() {
      rawSourceText = inEl.value;
      isFormattedState = false;
      updateStats('input', inEl.value);
    });

    // 快捷键 Ctrl+Enter 触发格式化
    inEl.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (currentTab === 'json') fmtRunJson('format');
        else if (currentTab === 'xml') fmtRunXml('format');
        else if (currentTab === 'sql') fmtRunSql('format');
      }
    });
  }

  // ── 双栏可拖拽分割线与比例持久化 ──
  function initSplitter() {
    var splitView = document.getElementById('fmt-split-view');
    var splitter = document.getElementById('fmt-splitter');
    var leftPane = document.getElementById('fmt-pane-input');
    var rightPane = document.getElementById('fmt-pane-output');
    if (!splitView || !splitter || !leftPane || !rightPane) return;

    var STORAGE_KEY = 'fmt_split_ratio';
    var isDragging = false;

    function applyRatio(ratio) {
      ratio = Math.max(15, Math.min(85, ratio));
      leftPane.style.flex = '0 0 ' + ratio + '%';
      rightPane.style.flex = '1 1 0';
    }

    // 优先读取 localStorage 历史缓存比例
    var savedRatio = parseFloat(localStorage.getItem(STORAGE_KEY));
    if (!isNaN(savedRatio) && savedRatio >= 15 && savedRatio <= 85) {
      applyRatio(savedRatio);
    } else {
      applyRatio(50);
    }

    splitter.addEventListener('pointerdown', function(e) {
      if (e.button !== 0) return;
      isDragging = true;
      try {
        splitter.setPointerCapture(e.pointerId);
      } catch (err) {}
      splitter.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
    });

    function onPointerMove(e) {
      if (!isDragging) return;
      var rect = splitView.getBoundingClientRect();
      if (rect.width <= 0) return;
      var offset = e.clientX - rect.left;
      var ratio = (offset / rect.width) * 100;
      applyRatio(ratio);
    }

    function stopDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      splitter.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      try {
        splitter.releasePointerCapture(e.pointerId);
      } catch (err) {}

      var rect = splitView.getBoundingClientRect();
      var leftRect = leftPane.getBoundingClientRect();
      if (rect.width > 0) {
        var finalRatio = (leftRect.width / rect.width) * 100;
        finalRatio = Math.max(15, Math.min(85, finalRatio));
        localStorage.setItem(STORAGE_KEY, finalRatio.toFixed(2));
      }
    }

    splitter.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointermove', onPointerMove);
    splitter.addEventListener('pointerup', stopDrag);
    window.addEventListener('pointerup', stopDrag);
    splitter.addEventListener('pointercancel', stopDrag);
    window.addEventListener('pointercancel', stopDrag);

    // 双击复位 50%
    splitter.addEventListener('dblclick', function() {
      applyRatio(50);
      localStorage.setItem(STORAGE_KEY, '50');
    });
  }

  window.initFormatterView = function() {
    setFmtViewMode(viewMode);
    renderToolbar();
    initDragDrop();
    initSplitter();
  };

  window.initFormatterView();
})();
</script>
